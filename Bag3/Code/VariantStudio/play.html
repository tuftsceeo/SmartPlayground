<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground Coder</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f7fb; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  #err { display: none; font: 16px 'Nunito', system-ui, sans-serif; color: #231f2e; padding: 40px; }
</style>
</head>
<body>
<!-- Runs the real Chat Broadcast with a variant applied.
     play.html#v=<base64url variant>   (link from the Variant Studio)
     play.html?src=examples/name.json  (a variant file next to this page) -->
<div id="err"></div>
<iframe id="app" title="Playground Coder" allow="serial"></iframe>
<script type="module">
  import { decodeVariant, compile, validate, normalize } from './js/variant.js';
  import { applyVariant, presetMode, onFrameDocument } from './js/apply.js';

  const err = msg => {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('app').style.display = 'none';
  };

  async function loadVariant() {
    const hash = new URLSearchParams(location.hash.slice(1)).get('v');
    if (hash) return decodeVariant(hash);
    const src = new URLSearchParams(location.search).get('src');
    if (src) {
      if (!/^[\w\-/]+\.json$/.test(src) || src.includes('..')) throw new Error('bad src');
      const r = await fetch(src, { cache: 'no-cache' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return normalize(await r.json());
    }
    return null;
  }

  let variant = null, broken = false;
  try {
    variant = await loadVariant();
  } catch (e) {
    broken = true;
    err('This variant link is broken — ask for a fresh link from the Variant Studio.');
  }
  if (!broken) {
    const problems = variant ? validate(variant) : [];
    if (problems.length) {
      err('This variant breaks the studio rules: ' + problems.join(' '));
    } else {
      const frame = document.getElementById('app');
      if (variant) {
        const compiled = compile(variant);
        document.title = compiled.name;
        presetMode(compiled.mode);
        onFrameDocument(frame, win => applyVariant(win, compiled));
      }
      frame.src = '../ChatBroadcast/index.html';
    }
  }
</script>
</body>
</html>
