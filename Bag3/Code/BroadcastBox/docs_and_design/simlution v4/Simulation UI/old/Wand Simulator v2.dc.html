<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#efece5;font-family:'Space Grotesk',system-ui,sans-serif}
a{color:#2a6fbf}a:hover{color:#1b4c88}
input,select,button,textarea{font-family:'JetBrains Mono',monospace}
input[type=range]{accent-color:#e08a2e}
@keyframes wandJump{0%{transform:translateY(0)}22%{transform:translateY(-46px) scaleY(1.04)}45%{transform:translateY(2px) scaleY(.96)}62%{transform:translateY(-14px)}80%{transform:translateY(0) scaleY(1.02)}100%{transform:translateY(0)}}
@keyframes wandShake{0%,100%{transform:translateX(0) rotate(0deg)}12%{transform:translateX(-13px) rotate(-4deg)}25%{transform:translateX(12px) rotate(4deg)}37%{transform:translateX(-11px) rotate(-3.4deg)}50%{transform:translateX(10px) rotate(3deg)}62%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(6px) rotate(1.6deg)}88%{transform:translateX(-3px) rotate(-.8deg)}}
@keyframes wandFlip{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes agitron{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}
@keyframes ping{0%{opacity:.85;transform:scale(.55)}100%{opacity:0;transform:scale(1.5)}}
</style></helmet>

<div style="width:390px;height:844px;margin:0 auto;background:#fff8e9;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Space Grotesk',sans-serif" data-screen-label="Wand simulator v2">

  <div style="display:flex;justify-content:space-between;padding:14px 24px 2px;font:500 11px 'JetBrains Mono';color:rgba(43,39,35,.4)"><span>9:41</span><span>WAND SIM</span></div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 20px 6px">
    <div><div style="font:700 18px 'Space Grotesk';color:#2b2723;letter-spacing:-.01em">Play with the wand</div><div style="font:500 10px 'JetBrains Mono';color:rgba(43,39,35,.5);letter-spacing:.04em">{{ status }}</div></div>
    <div style="display:flex;gap:6px">
      <button onClick="{{ advT }}" title="Show the accelerometer readout and extra inputs" style-hover="filter:brightness(1.04)" style="padding:0 10px;height:38px;border-radius:12px;border:2px solid #2b2723;color:#2b2723;font:700 9px 'JetBrains Mono';letter-spacing:.06em;cursor:pointer;box-shadow:0 3px 0 #2b2723;background:{{ advBg }}">{{ advLbl }}</button>
      <button onClick="{{ mute }}" title="Mute the simulator's sound" style-hover="filter:brightness(1.04)" style="width:38px;height:38px;border-radius:12px;border:2px solid #2b2723;background:#fff;color:#2b2723;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #2b2723">{{ muteLbl }}</button>
      <button onClick="{{ reset }}" title="Start over" style-hover="filter:brightness(1.06)" style="width:38px;height:38px;border-radius:12px;border:2px solid #2b2723;background:#ffc94d;color:#2b2723;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #2b2723">↻</button>
    </div>
  </div>

  <div onPointerMove="{{ padMove }}" onPointerLeave="{{ padLeave }}" onPointerDown="{{ padDown }}" onPointerUp="{{ padUp }}" title="Move to tilt · click to press the button" style="position:relative;height:432px;margin:0 16px;border-radius:28px;background:radial-gradient(circle at 50% 46%,#fffdf6 0%,#f5ecd8 62%,#eee1c6 100%);border:3px solid #2b2723;box-shadow:0 5px 0 #2b2723;overflow:hidden;touch-action:none;cursor:{{ padCursor }}">

    <sc-if value="{{ advanced }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;pointer-events:none">
        <div style="position:absolute;top:9px;left:0;right:0;text-align:center;font:700 9px 'JetBrains Mono';letter-spacing:.14em;transition:color .15s;color:{{ hintTopColor }}">TIP UP</div>
        <div style="position:absolute;bottom:9px;left:0;right:0;text-align:center;font:700 9px 'JetBrains Mono';letter-spacing:.14em;transition:color .15s;color:{{ hintBottomColor }}">TIP DOWN</div>
        <div style="position:absolute;top:50%;left:10px;transform:translateY(-50%);font:700 9px/1.3 'JetBrains Mono';letter-spacing:.1em;transition:color .15s;color:{{ hintLeftColor }}">LEFT<br>UP</div>
        <div style="position:absolute;top:50%;right:10px;transform:translateY(-50%);text-align:right;font:700 9px/1.3 'JetBrains Mono';letter-spacing:.1em;transition:color .15s;color:{{ hintRightColor }}">RIGHT<br>UP</div>
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;border:2px dashed rgba(43,39,35,.16)"></div>
      </div>
    </sc-if>

    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
      <div style="animation:{{ gestureAnim }}">
        <div style="transition:transform .22s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d;transform:{{ tilt3d }}">
          <div style="position:relative;pointer-events:auto">
            <dc-import name="Wand" hint-size="192px,320px" w="192px" leds="{{ leds }}" speaker-color="{{ spk }}" speaker-glow="{{ spkGlow }}" motor-opacity="0" btn-shadow="{{ btnSh }}" btn-press="{{ btnPr }}"></dc-import>
            <sc-for list="{{ agitrons }}" as="a" hint-placeholder-count="0">
              <div style="position:absolute;pointer-events:none;font-weight:700;color:#2b2723;left:{{ a.left }};top:{{ a.top }};font-size:{{ a.size }};transform:rotate({{ a.rot }});--dx:{{ a.dx }};--dy:{{ a.dy }};animation:agitron .5s ease-out forwards">{{ a.mark }}</div>
            </sc-for>
            <sc-for list="{{ pings }}" as="p" hint-placeholder-count="0">
              <div style="position:absolute;pointer-events:none;border-radius:50%;border:3px solid {{ p.color }};right:2%;top:3%;width:29%;aspect-ratio:1;animation:ping .55s ease-out forwards"></div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <sc-if value="{{ advanced }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;pointer-events:none">
      <sc-for list="{{ axes }}" as="a" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font:700 9px 'JetBrains Mono';color:rgba(43,39,35,.55);width:9px">{{ a.n }}</span>
          <div style="position:relative;width:74px;height:7px;border-radius:4px;background:rgba(43,39,35,.1);border:1.5px solid rgba(43,39,35,.35)">
            <div style="position:absolute;top:0;bottom:0;background:#2b2723;border-radius:3px;transition:all .12s;left:{{ a.left }};width:{{ a.w }}"></div>
          </div>
          <span style="font:700 9px 'JetBrains Mono';color:rgba(43,39,35,.65);width:30px">{{ a.v }}</span>
        </div>
      </sc-for>
    </div>
    </sc-if>

    <div style="position:absolute;right:14px;bottom:12px;font:700 9px 'JetBrains Mono';color:rgba(43,39,35,.4);text-align:right;pointer-events:none;max-width:130px;line-height:1.5">{{ padHint }}</div>
  </div>

  <div style="display:flex;gap:6px;padding:12px 16px 0">
    <sc-for list="{{ gestures }}" as="g" hint-placeholder-count="3">
      <button onClick="{{ g.onClick }}" title="{{ g.tip }}" style-hover="filter:brightness(1.05)" style-active="transform:translateY(3px);box-shadow:0 0 0 #2b2723" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;border-radius:14px;border:2px solid #2b2723;background:#a8e6cf;color:#1e3f33;font:700 11px 'JetBrains Mono';cursor:pointer;box-shadow:0 3px 0 #2b2723;transition:all .1s"><span style="font-size:15px;line-height:1">{{ g.glyph }}</span>{{ g.name }}</button>
    </sc-for>
    <button onClick="{{ flipOver }}" title="Turn the wand over" style-hover="filter:brightness(1.05)" style-active="transform:translateY(3px);box-shadow:0 0 0 #2b2723" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;border-radius:14px;border:2px solid #2b2723;font:700 11px 'JetBrains Mono';cursor:pointer;box-shadow:0 3px 0 #2b2723;transition:all .1s;background:{{ faceDownBg }};color:#2b2723"><span style="font-size:15px;line-height:1">⇋</span>TURN OVER</button>
  </div>

  <div style="display:flex;align-items:center;gap:9px;padding:10px 18px 0">
    <span style="font:700 9px 'JetBrains Mono';color:rgba(43,39,35,.5);letter-spacing:.08em">HOW HARD</span>
    <input type="range" min="5" max="100" value="{{ shake }}" onChange="{{ onShake }}" title="Shake magnitude" style="flex:1">
    <span style="font:700 10px 'JetBrains Mono';color:#2b2723;width:22px;text-align:right">{{ shake }}</span>
  </div>

  <div style="display:flex;gap:6px;padding:10px 16px 14px;overflow-x:auto">
    <sc-for list="{{ tags }}" as="t" hint-placeholder-count="6">
      <button onClick="{{ t.onClick }}" title="Touch this tag to the wand" style-hover="filter:brightness(1.05)" style="flex:none;padding:9px 12px;border-radius:20px;border:2px solid #2b2723;box-shadow:0 3px 0 #2b2723;font:700 10px 'JetBrains Mono';color:#2b2723;cursor:pointer;background:{{ t.bg }}">◎ {{ t.t }}</button>
    </sc-for>
  </div>

  <div style="flex:1;min-height:22px"></div>

  <sc-if value="{{ advanced }}" hint-placeholder-val="{{ false }}">
  <div style="margin:0 18px 0;border-top:2px dashed rgba(43,39,35,.18);padding-top:6px">
    <button onClick="{{ drawerT }}" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:3px 0;color:rgba(43,39,35,.55);font:700 9.5px 'JetBrains Mono';letter-spacing:.1em;cursor:pointer">ADVANCED · CUSTOM TAG / RADIO<span>{{ drawerCaret }}</span></button>
    <sc-if value="{{ drawer }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:6px;padding:7px 0 0">
        <div style="display:flex;gap:6px"><input value="{{ free }}" onChange="{{ onFree }}" placeholder="type any tag word" style="flex:1;min-width:0;padding:9px 11px;border-radius:11px;border:2px solid #2b2723;background:#fff;color:#2b2723;font:400 11px 'JetBrains Mono'"><button onClick="{{ sendFree }}" style="padding:0 13px;border-radius:11px;border:2px solid #2b2723;background:#ffc94d;color:#2b2723;font:700 10px 'JetBrains Mono';cursor:pointer">SCAN</button></div>
        <div style="display:flex;gap:6px"><input value="{{ esp }}" onChange="{{ onEsp }}" placeholder="message from another wand" style="flex:1;min-width:0;padding:9px 11px;border-radius:11px;border:2px solid #2b2723;background:#fff;color:#2b2723;font:400 11px 'JetBrains Mono'"><button onClick="{{ sendEsp }}" style="padding:0 13px;border-radius:11px;border:2px solid #2b2723;background:#9fd8ff;color:#2b2723;font:700 10px 'JetBrains Mono';cursor:pointer">SEND</button></div>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <sc-if value="{{ advanced }}" hint-placeholder-val="{{ false }}">
  <div style="padding:8px 20px 22px;font:400 10px/1.5 'JetBrains Mono';color:rgba(43,39,35,.5);height:40px;overflow:hidden">
    <sc-for list="{{ logs }}" as="l" hint-placeholder-count="2"><div style="display:flex;gap:8px"><span style="color:rgba(43,39,35,.32)">{{ l.t }}</span><span>{{ l.s }}</span></div></sc-for>
  </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultMute&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Simulation&quot;},&quot;logLines&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulation&quot;}}">
const PERIM=[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24];
const UP=[2,6,7,8,10,12,14,17,22];
const XPAT=[0,4,6,8,12,16,18,20,24];
const PLUS=[2,7,10,11,12,13,14,17,22];
const CENTER=[6,7,8,11,12,13,16,17,18];
const rot=i=>(i%5)*5+(4-Math.floor(i/5));
function rotN(s,n){let a=s;for(let k=0;k<n;k++)a=a.map(rot);return a;}
const ARROW={up:UP,right:rotN(UP,1),down:rotN(UP,2),left:rotN(UP,3)};
const ORI={
  tip_up:{n:'Tip up',hue:95,set:ARROW.up},
  tip_down:{n:'Tip down',hue:230,set:ARROW.down},
  left_up:{n:'Left up',hue:330,set:ARROW.left},
  right_up:{n:'Right up',hue:160,set:ARROW.right},
  face_up:{n:'Face up',hue:60,set:PERIM.concat([12])},
  face_down:{n:'Face down',hue:285,set:XPAT}
};
const TAGS=['note_a','note_b','note_c','eggs','sugar','flour','stop','go','freeze','run','dance'];
const OFF='#231f1a';
function paint(set,on){const a=[];
  for(let i=0;i<25;i++){const v=set.indexOf(i)>=0;
    a.push({c:v?on:OFF,g:v?('0 0 10px '+on+', inset 0 0 4px rgba(255,255,255,.45)'):'inset 0 0 0 1px rgba(255,255,255,.05)'});}
  return a;}
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function tagSet(h){const s=[];for(let i=0;i<25;i++)if(((h*(i+3))%17)<7)s.push(i);return s.length?s:CENTER;}
const MARKS=['≡','≈','~','∴','·'];

class Component extends DCLogic {
  constructor(p){super(p);this.t={};this.seq=0;
    this.state={ax:0,ay:0,faceDown:false,orient:'face_up',motor:false,mute:!!p.defaultMute,tone:0,
      flash:null,log:[],free:'',esp:'',shake:60,drawer:false,pressed:false,held:false,
      gestureAnim:'none',agitrons:[],pings:[],hovering:false,advanced:false};}
  componentWillUnmount(){Object.keys(this.t).forEach(k=>clearTimeout(this.t[k]));}
  lines(){const n=parseInt(this.props.logLines,10);return n>0?n:2;}
  log(s){const t=new Date().toTimeString().slice(0,8);
    this.setState(p=>({log:[{t:t,s:s}].concat(p.log).slice(0,30)}));}

  beep(freq,dur){
    if(!this.state.mute){try{
      if(!this.ac)this.ac=new (window.AudioContext||window.webkitAudioContext)();
      const ac=this.ac;if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);
      const t0=ac.currentTime;g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.08,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur/1000);
      o.start(t0);o.stop(t0+dur/1000+0.03);
    }catch(e){}}
    this.setState({tone:Math.round(freq)});
    const hue=Math.round(((freq-120)/1300*320+20)%360);
    this.ping('oklch(0.78 0.18 '+hue+')');
    clearTimeout(this.t.tone);
    this.t.tone=setTimeout(()=>this.setState({tone:0}),dur+160);
  }
  ping(color){const id=++this.seq;
    this.setState(p=>({pings:p.pings.concat([{id:id,color:color}])}));
    setTimeout(()=>this.setState(p=>({pings:p.pings.filter(x=>x.id!==id)})),560);}
  buzz(ms){
    this.setState({motor:true});
    if(navigator.vibrate&&!this.state.mute){try{navigator.vibrate(ms);}catch(e){}}
    this.spawnAgitrons();
    clearTimeout(this.t.agi);
    if(ms>260)this.t.agi=setTimeout(()=>this.spawnAgitrons(),240);
    clearTimeout(this.t.motor);
    this.t.motor=setTimeout(()=>this.setState({motor:false}),ms);
  }
  spawnAgitrons(){
    const made=[];
    for(let k=0;k<7;k++){
      const id=++this.seq;
      const side=k%2?1:-1, up=k<4?-1:1;
      made.push({id:id,mark:MARKS[k%MARKS.length],
        left:(side<0?(-6+Math.random()*8):(96+Math.random()*8))+'%',
        top:(10+Math.random()*72)+'%',
        size:(11+Math.random()*8)+'px',
        rot:Math.round(-30+Math.random()*60)+'deg',
        dx:Math.round(side*(12+Math.random()*16))+'px',
        dy:Math.round(up*(6+Math.random()*14))+'px'});
    }
    this.setState(p=>({agitrons:p.agitrons.concat(made)}));
    const ids=made.map(m=>m.id);
    setTimeout(()=>this.setState(p=>({agitrons:p.agitrons.filter(a=>ids.indexOf(a.id)<0)})),520);
  }
  flash(leds,ms){this.setState({flash:leds});clearTimeout(this.t.f);
    this.t.f=setTimeout(()=>this.setState({flash:null}),ms||620);}
  fire(label,leds,freq,motorMs){this.log(label);this.flash(leds,620);this.beep(freq,180);if(motorMs)this.buzz(motorMs);}

  detect(ax,ay,faceDown){
    if(faceDown)return 'face_down';
    if(Math.abs(ay)>=Math.abs(ax)){if(ay<=-45)return 'tip_up';if(ay>=45)return 'tip_down';}
    else{if(ax<=-45)return 'left_up';if(ax>=45)return 'right_up';}
    return 'face_up';
  }
  setAxes(ax,ay){
    const k=this.detect(ax,ay,this.state.faceDown);
    const changed=k!==this.state.orient;
    this.setState({ax:ax,ay:ay,orient:k,hovering:true});
    if(changed){const o=ORI[k];
      this.log('ORIENTATION → '+o.n);
      this.flash(paint(o.set,'oklch(0.8 0.17 '+o.hue+')'),620);
      this.beep(220+o.hue*1.7,170);}
  }
  padMove(e){
    const r=e.currentTarget.getBoundingClientRect();
    const ax=Math.max(-100,Math.min(100,Math.round(((e.clientX-r.left)/r.width-0.5)*230)));
    const ay=Math.max(-100,Math.min(100,Math.round(((e.clientY-r.top)/r.height-0.5)*230)));
    this.setAxes(ax,ay);
  }
  padLeave(){this.setState({hovering:false});if(this.state.pressed)this.btnUp();}
  padDown(e){this.padMove(e);this.btnDown();}
  flipOver(){
    const nv=!this.state.faceDown;
    this.setState({faceDown:nv});
    this.playAnim('wandFlip .62s cubic-bezier(.4,.1,.3,1)',620);
    const k=this.detect(this.state.ax,this.state.ay,nv);
    this.setState({orient:k});
    this.log('TURNED '+(nv?'FACE DOWN':'FACE UP'));
    this.flash(paint(ORI[k].set,'oklch(0.8 0.17 '+ORI[k].hue+')'),620);
    this.beep(nv?300:620,190);this.buzz(120);
  }
  playAnim(a,ms){this.setState({gestureAnim:'none'});
    clearTimeout(this.t.anim0);clearTimeout(this.t.anim1);
    this.t.anim0=setTimeout(()=>this.setState({gestureAnim:a}),20);
    this.t.anim1=setTimeout(()=>this.setState({gestureAnim:'none'}),ms+40);}
  jump(){this.playAnim('wandJump .62s cubic-bezier(.3,.7,.4,1)',620);
    this.fire('JUMP',paint(PLUS,'#fff6dd'),780,90);}
  shake(){const m=this.state.shake,set=[];
    for(let k=0;k<25;k++)if(Math.random()*100<m)set.push(k);
    this.playAnim('wandShake '+(0.62-m*0.0022).toFixed(2)+'s ease-in-out',640);
    this.fire('SHAKE (how hard: '+m+')',paint(set,'oklch(0.82 0.17 70)'),260+m*4,60+Math.round(m*2.4));}
  flip(){this.playAnim('wandFlip .58s cubic-bezier(.4,.05,.3,1)',600);
    this.fire('FLIP',paint(XPAT,'oklch(0.8 0.17 330)'),520,150);}
  press(hold){this.fire('BUTTON '+(hold?'held':'tapped'),
    paint(hold?PERIM.concat([12]):CENTER,'#fffaf0'),hold?240:560,hold?220:0);}
  btnDown(){clearTimeout(this.t.h);this.setState({held:false,pressed:true});
    this.t.h=setTimeout(()=>{this.setState({held:true});this.press(true);},450);}
  btnUp(){clearTimeout(this.t.h);this.setState({pressed:false});
    if(this.state.held)this.setState({held:false});else this.press(false);}
  tag(str,src){const v=(str||'').trim();if(!v)return;
    const h=hash(v.toLowerCase()),hue=h%360;
    this.fire((src==='esp'?'MESSAGE':'TAG')+' "'+v+'"',paint(tagSet(h),'oklch(0.8 0.17 '+hue+')'),200+hue*1.6,src==='esp'?80:0);}
  reset(){Object.keys(this.t).forEach(k=>clearTimeout(this.t[k]));
    this.setState({ax:0,ay:0,faceDown:false,orient:'face_up',motor:false,tone:0,flash:null,log:[],
      free:'',esp:'',drawer:false,pressed:false,held:false,gestureAnim:'none',agitrons:[],pings:[]});
    this.log('— START OVER —');this.beep(720,190);this.flash(paint(PERIM,'#8ee06b'),620);}

  renderVals(){
    const s=this.state,o=ORI[s.orient];
    const hue=s.tone?Math.round(((s.tone-120)/1300*320+20)%360):0;
    const tone=s.tone?'oklch(0.78 0.18 '+hue+')':'#2d2d2d';
    const axis=(n,val)=>({n:n,v:(val>0?'+':'')+val,
      left:(val<0?(50+val/2):50)+'%',w:(Math.abs(val)/2)+'%'});
    const az=s.faceDown?-98:Math.round(98-(Math.abs(s.ax)+Math.abs(s.ay))*0.42);
    return {
      leds:s.flash||paint(o.set,'oklch(0.55 0.11 '+o.hue+')'),
      spk:tone,spkGlow:s.tone?'0 0 16px '+tone:'none',
      tilt3d:'perspective(950px) rotateY('+(s.ax*0.42)+'deg) rotateX('+(-s.ay*0.42)+'deg)'+(s.faceDown?' rotateY(180deg)':''),
      gestureAnim:s.gestureAnim,
      agitrons:s.agitrons,pings:s.pings,
      status:o.n.toUpperCase()+' · '+(s.mute?'SOUND OFF':'SOUND ON'),
      padHint:s.pressed?'button down':(s.hovering?'click to press':'move to tilt · click to press'),
      hintTopColor:s.orient==='tip_up'?'#2b2723':'rgba(43,39,35,.32)',
      hintBottomColor:s.orient==='tip_down'?'#2b2723':'rgba(43,39,35,.32)',
      hintLeftColor:s.orient==='left_up'?'#2b2723':'rgba(43,39,35,.32)',
      hintRightColor:s.orient==='right_up'?'#2b2723':'rgba(43,39,35,.32)',
      axes:[axis('X',s.ax),axis('Y',s.ay),axis('Z',az)],
      faceDownBg:s.faceDown?'#d3a9f7':'#fff',
      shake:s.shake,onShake:e=>this.setState({shake:parseInt(e.target.value,10)}),
      btnSh:s.pressed?'0 1px 0 #2b2723':'0 5px 0 #2b2723',
      btnPr:s.pressed?'translateY(4px)':'none',
      btnDown:()=>this.btnDown(),btnUp:()=>this.btnUp(),
      padMove:e=>this.padMove(e),padLeave:()=>this.padLeave(),
      padDown:e=>this.padDown(e),padUp:()=>{if(this.state.pressed)this.btnUp();},
      advanced:s.advanced,
      advLbl:s.advanced?'ADVANCED':'SIMPLE',
      advBg:s.advanced?'#ffc94d':'#fff',
      advT:()=>this.setState(p=>({advanced:!p.advanced})),
      padCursor:s.pressed?'grabbing':'pointer',
      flipOver:()=>this.flipOver(),
      gestures:[
        {name:'JUMP',glyph:'⇡',tip:'Toss the wand up',onClick:()=>this.jump()},
        {name:'SHAKE',glyph:'≈',tip:'Shake it back and forth',onClick:()=>this.shake()},
        {name:'FLIP',glyph:'⟳',tip:'Spin it over once',onClick:()=>this.flip()}
      ],
      tags:TAGS.map(t=>({t:t,bg:'oklch(0.9 0.08 '+(hash(t)%360)+')',onClick:()=>this.tag(t,'nfc')})),
      free:s.free,esp:s.esp,
      onFree:e=>this.setState({free:e.target.value}),
      onEsp:e=>this.setState({esp:e.target.value}),
      sendFree:()=>this.tag(this.state.free,'free'),
      sendEsp:()=>this.tag(this.state.esp,'esp'),
      drawer:s.drawer,drawerCaret:s.drawer?'▲':'▼',
      drawerT:()=>this.setState(p=>({drawer:!p.drawer})),
      mute:()=>{this.setState(p=>({mute:!p.mute}));this.log('SOUND '+(s.mute?'ON':'OFF'));},
      muteLbl:s.mute?'🔇':'🔈',
      reset:()=>this.reset(),
      logs:s.log.slice(0,this.lines())
    };
  }
}

</script>
</body>
</html>
