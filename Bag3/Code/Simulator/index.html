<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wand Game Simulator</title>
  <style>
    /* Palette + type match Bag3/Code/TeacherTools/BroadcastBox/ChatBroadcast/css/app.css's
       :root tokens — a color/type starting point for matching that app's
       look, ahead of the actual wand-artwork compositing pass. */
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800;900&display=swap');
    :root {
      --pink: #ef4d92;
      --pink-dark: #d13a7c;
      --purple: #6c4cd1;
      --teal: #22c3a6;
      --yellow: #ffd23f;
      --ink: #231f2e;
      --muted: #8b859a;
      --border: #e8e6f0;
      --bg: #f7f7fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 6% 10%, #ffd23f22, transparent 40%),
        radial-gradient(circle at 94% 6%, #ef4d9218, transparent 38%),
        radial-gradient(circle at 90% 94%, #22c3a61c, transparent 42%),
        radial-gradient(circle at 8% 92%, #6c4cd11a, transparent 40%),
        var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    h1 { font: 800 1.4rem 'Nunito'; margin: 0 0 16px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 16px;
    }
    label { font-size: 0.9rem; font-weight: 700; }
    select, button {
      font: 700 0.9rem 'Nunito'; padding: 8px 14px; border-radius: 12px;
      border: 1.5px solid var(--border); background: #fff; color: var(--ink);
    }
    button { cursor: pointer; background: var(--purple); border-color: var(--purple); color: #fff; }
    button:hover { background: #5a3fb0; }
    .loaded-file-name { font-size: 0.85rem; color: var(--muted); }
    /* The panel's own design width — it lays out as two panes above this
       and one below it, so a wider box just pads the control column. */
    sim-room { max-width: 900px; }
    .overlay-row { margin-top: 16px; }
    .overlay-row button { background: #fff; border-color: var(--border); color: var(--ink); }
    .overlay-row button:hover { background: #fff0f6; border-color: var(--pink); color: var(--pink-dark); }
    .row-label { font: 700 0.8rem 'Nunito'; color: var(--muted); margin-right: 4px; }
    #log {
      max-width: 900px; height: 180px; overflow: auto; margin: 16px 0 0;
      padding: 10px 12px; border-radius: 12px; background: var(--ink); color: #c9c3e0;
      font: 11px ui-monospace, monospace; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Wand Game Simulator</h1>

  <div class="toolbar">
    <label>
      Game
      <select id="game-select">
        <option value="jump">jump</option>
        <option value="shake">shake</option>
        <option value="shake_rainbow">shake_rainbow</option>
        <option value="sound">sound</option>
        <option value="rainbow">rainbow</option>
        <option value="jumpin">jumpin</option>
        <option value="nfc_sound">nfc_sound</option>
        <option value="gestures">gestures</option>
        <option value="simpleicecream">simpleicecream</option>
        <option value="melody">melody</option>
        <option value="cooking">cooking</option>
        <option value="multiicecream">multiicecream</option>
        <option value="freeze_dance">freeze_dance</option>
        <option value="goalrace">goalrace (with display)</option>
        <option value="color_quest">color_quest</option>
        <option value="finddevice">finddevice</option>
        <option value="lobbytest">lobbytest (lobby)</option>
        <option value="splattag">splattag (lobby)</option>
        <option value="relaycolor">relaycolor (lobby)</option>
      </select>
    </label>
    <button type="button" id="btn-restart">Start over</button>
    <button type="button" id="btn-load-file">Load file…</button>
    <input type="file" id="file-input" accept=".py" hidden>
    <span id="loaded-file-name" class="loaded-file-name"></span>
    <label><input type="checkbox" id="chk-advanced" checked> Advanced</label>
  </div>

  <sim-room id="sim" game="jump" autostart advanced></sim-room>

  <div class="toolbar overlay-row">
    <span class="row-label">Pop-ups</span>
    <button type="button" data-overlay="welcome">Welcome</button>
    <button type="button" data-overlay="new-code">New code loaded</button>
    <button type="button" data-overlay="game-over">Game over</button>
    <button type="button" data-overlay="cant-simulate">Can't simulate</button>
  </div>

  <pre id="log"></pre>

  <script type="module">
    import "./sim-room.js";

    const sim = document.getElementById("sim");
    const wand = sim.wand;
    const select = document.getElementById("game-select");
    const fileInput = document.getElementById("file-input");
    const loadedFileName = document.getElementById("loaded-file-name");

    // ?game=<name> picks the starting game (used by tools/room_smoke.mjs).
    const startGame = new URLSearchParams(location.search).get("game");
    if (startGame) {
      select.value = startGame;
      sim.setAttribute("game", startGame);
    }

    select.addEventListener("change", () => {
      // Drop any previously-loaded custom file without forcing a second
      // reload here — the game attribute change below reloads once.
      sim._source = null;
      wand._source = null;
      loadedFileName.textContent = "";
      sim.setAttribute("autostart", "");
      sim.setAttribute("game", select.value);
    });

    document.getElementById("btn-restart").addEventListener("click", () => sim.restart());

    document.getElementById("btn-load-file").addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const text = await file.text();
      sim.setAttribute("autostart", "");
      sim.source = text; // triggers a reload via <wand-sim>'s source setter
      loadedFileName.textContent = file.name;
      fileInput.value = ""; // allow re-selecting the same file later
    });

    // The four pop-ups are the element's to draw and the host's to trigger,
    // so the rig exercises both halves: a button per kind, and a log of the
    // action each one reports back.
    for (const b of document.querySelectorAll("[data-overlay]")) {
      b.addEventListener("click", () => wand.showOverlay(b.dataset.overlay));
    }
    wand.addEventListener("sim-overlay-action", (e) => console.log("sim-overlay-action", e.detail));

    wand.addEventListener("sim-ready", () => console.log("sim-ready"));
    wand.addEventListener("sim-error", (e) => console.error("sim-error", e.detail));
    wand.addEventListener("sim-stopped", () => console.log("sim-stopped"));
    sim.addEventListener("room-capabilities", (e) => console.log("room-capabilities", e.detail));

    document.getElementById("chk-advanced").addEventListener("change", (e) => {
      sim.toggleAttribute("advanced", e.target.checked);
    });

    // The simulator draws no text of its own; its lines arrive as events.
    const log = document.getElementById("log");
    function logLine(tag, text) {
      const lines = (log.textContent ? log.textContent.split("\n") : []).slice(-199);
      lines.push(`${tag.padEnd(7)} ${text}`);
      log.textContent = lines.join("\n");
      log.scrollTop = log.scrollHeight;
    }
    sim.addEventListener("sim-log", (e) => logLine("wand", e.detail.text));
    sim.addEventListener("sim-error", (e) => logLine("error", `${e.detail.phase}: ${e.detail.message}`));
    sim.addEventListener("display-print", (e) => logLine("display", e.detail.text));
    sim.addEventListener("room-radio", (e) => logLine("radio", e.detail.text));
    sim.addEventListener("sim-enow-sent", (e) => logLine("enow", `${e.detail.kind} → ${e.detail.mac || "all"}: ${e.detail.data}`));
  </script>
</body>
</html>
