<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Colored, never grey — purple for shells, pink for pink actions" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:'Nunito',sans-serif;background:#fff;color:var(--ink)}
.sw{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)}
.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.n{font:800 11px 'Nunito'}.h{font:600 10px ui-monospace,monospace;opacity:.75}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font:700 10px 'Nunito';letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.c{background:#fff;border-radius:20px;height:88px;display:flex;align-items:center;justify-content:center;font:700 11px Nunito;color:var(--ink-3);text-align:center;padding:0 10px}body{background:var(--bg)}.gs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}</style>
<div class="gs">
<div class="c" style="box-shadow:var(--shadow-shell)">shell<br>purple 18/40</div>
<div class="c" style="box-shadow:var(--shadow-overlay)">overlay<br>ink 24/60</div>
<div class="c" style="box-shadow:var(--shadow-pink);background:var(--grad-pink);color:#fff">pink action<br>10/22</div>
<div class="c" style="border:1.5px solid var(--border)">card<br>border, no shadow</div>
</div>
