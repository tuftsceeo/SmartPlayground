<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:'Nunito',sans-serif;background:#fff;color:var(--ink)}

.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.n{font:800 11px 'Nunito'}.h{font:600 10px ui-monospace,monospace;opacity:.75}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font:700 10px 'Nunito';letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
body{padding:0;height:200px;background:var(--grad-playground),var(--bg)}.pn{position:absolute;inset:24px;background:#fff;border-radius:24px;box-shadow:var(--shadow-shell);display:flex;align-items:center;justify-content:center;font:20px "Patrick Hand";color:#5b5468}</style>
