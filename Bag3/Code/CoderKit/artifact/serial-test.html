<title>USB Serial Test</title>
<style>
  :root { --bg:#f7f7fb; --ink:#231f2e; --muted:#5b5468; --card:#fff; --border:#e8e6f0; --ok:#1c9a82; --bad:#c0392b; --btn:#d13a7c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1a1720; --ink:#f2eefc; --muted:#c2b8d6; --card:#25212d; --border:#3a3345; --ok:#5fd9bf; --bad:#ff8a7d; } }
  :root[data-theme="dark"] { --bg:#1a1720; --ink:#f2eefc; --muted:#c2b8d6; --card:#25212d; --border:#3a3345; --ok:#5fd9bf; --bad:#ff8a7d; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { background:var(--btn); color:#fff; border:0; border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  input { flex:1; min-width:0; padding:10px; border-radius:12px; border:1.5px solid var(--border); background:var(--card); color:var(--ink); }
  pre { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:12px; min-height:220px; white-space:pre-wrap; word-break:break-word; font:12px/1.5 ui-monospace, monospace; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
<main>
  <h1>USB Serial Test</h1>
  <p>Checks whether this artifact can open a USB serial port. Plug in the Dial or Box, use Chrome, then click Connect.</p>
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>
  <div class="row">
    <input id="line" placeholder="Text to send (a newline is added)" disabled>
    <button id="send" disabled>Send</button>
  </div>
  <pre id="log"></pre>
</main>
<script>
  const $ = id => document.getElementById(id);
  const log = (msg, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = msg + '\n'; $('log').appendChild(s); $('log').scrollTop = 1e9; };
  let port, reader, writer;

  // 1. What this frame is allowed to do.
  log('Browser: ' + navigator.userAgent.match(/(Chrome|Edg|Firefox|Safari)\/[\d.]+/g)?.join(' ') );
  log('In a frame: ' + (window.top !== window ? 'yes' : 'no'));
  log('navigator.serial present: ' + ('serial' in navigator ? 'yes' : 'no'), 'serial' in navigator ? 'ok' : 'bad');
  try {
    const fp = document.featurePolicy || document.permissionsPolicy;
    if (fp) log('Frame allows "serial": ' + (fp.allowsFeature('serial') ? 'yes' : 'no'), fp.allowsFeature('serial') ? 'ok' : 'bad');
  } catch (e) { log('Could not read frame permissions: ' + e.message); }

  async function connect() {
    if (!('serial' in navigator)) return log('No Web Serial here. Use Chrome or Edge on a computer.', 'bad');
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      log('Port open.', 'ok');
      writer = port.writable.getWriter();
      $('connect').disabled = true; $('disconnect').disabled = false; $('line').disabled = false; $('send').disabled = false;
      readLoop();
    } catch (e) {
      log('Connect failed: ' + e.name + ': ' + e.message, 'bad');
    }
  }
  async function readLoop() {
    const dec = new TextDecoder();
    try {
      reader = port.readable.getReader();
      for (;;) { const { value, done } = await reader.read(); if (done) break; log('← ' + dec.decode(value).trimEnd()); }
    } catch (e) { log('Read stopped: ' + e.message); }
    finally { reader?.releaseLock(); }
  }
  async function send() {
    const t = $('line').value; $('line').value = '';
    await writer.write(new TextEncoder().encode(t + '\n'));
    log('→ ' + t);
  }
  async function disconnect() {
    try { await reader?.cancel(); writer?.releaseLock(); await port?.close(); log('Closed.'); } catch (e) { log('Close: ' + e.message); }
    $('connect').disabled = false; $('disconnect').disabled = true; $('line').disabled = true; $('send').disabled = true;
  }
  $('connect').onclick = connect;
  $('disconnect').onclick = disconnect;
  $('send').onclick = send;
  $('line').onkeydown = e => { if (e.key === 'Enter') send(); };
</script>
