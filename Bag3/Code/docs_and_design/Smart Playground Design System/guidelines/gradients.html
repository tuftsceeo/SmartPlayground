<!-- @dsCard group="Colors" viewport="700x150" name="Gradients" subtitle="Every filled action is a 135° two-stop gradient" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:'Nunito',sans-serif;background:#fff;color:var(--ink)}
.sw{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)}
.sw>div{flex:1;height:78px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;gap:1px}
.n{font:800 11px 'Nunito'}.h{font:600 10px ui-monospace,monospace;opacity:.75}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font:700 10px 'Nunito';letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g{height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font:800 13px Nunito}.gs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cap{font:600 10px ui-monospace,monospace;color:var(--muted);text-align:center;margin-top:5px}</style>
<div class="gs">
<div><div class="g" style="background:var(--grad-pink)">primary</div><div class="cap">--grad-pink</div></div>
<div><div class="g" style="background:var(--grad-gem)">brand gem</div><div class="cap">--grad-gem</div></div>
<div><div class="g" style="background:var(--grad-teal)">connect</div><div class="cap">--grad-teal</div></div>
<div><div class="g" style="background:var(--grad-muted)">connected</div><div class="cap">--grad-muted</div></div>
</div>
