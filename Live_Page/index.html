<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }

        .buttons-container {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            width: 200px;
            height: 200px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .button-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .button-card h2 {
            color: #667eea;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .button-card p {
            color: #666;
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: center;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 0.8rem;
        }

        .tufts-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 1.5rem 3rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 2rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .tufts-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .tufts-button {
                font-size: 1.2rem;
                padding: 1.2rem 2rem;
            }

            .button-card {
                width: 160px;
                height: 160px;
                padding: 1.5rem;
            }

            .button-card h2 {
                font-size: 1.1rem;
            }

            .button-card p {
                font-size: 0.75rem;
            }

            .icon {
                font-size: 3rem;
            }

            .buttons-container {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
       
        <a href="https://sites.tufts.edu/smartplayground/" target="_blank" class="tufts-button">
            <h1></h1>SmartPlayground @ Tufts Homepage</h1>
        </a>
        <p class="subtitle">Choose an application</p>
        
        
        
        <div class="buttons-container">
            <a href="WebApp/index.html" class="button-card">
                <div class="icon">📱</div>
                <h2>WebApp</h2>
                <p>Teacher control of your Smart Playground</p>
            </a>
            
            <a href="If_Splats/index.html" class="button-card">
                <div class="icon">🫟</div>
                <h2>If Splats</h2>
                <p>If condition programming for Splats</p>
            </a>
        </div>
    </div>
</body>
</html>
