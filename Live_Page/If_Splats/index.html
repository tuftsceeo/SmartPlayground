<!DOCTYPE html>
<html lang="en">
<head>
    <title>If Splats</title>
    <!-- Recommended meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.2.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- my CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <script type="mpy" src="./main.py" config="./pyscript.json" env='splats' setup></script>
    
    <div class="container"> 
        <h1>Splats</h1>
        <p class="subtitle">Control and configure your Splats device with style</p>
        
        <div class="card">
            <h3>Device Connection</h3>
            <div class="connection-controls">
                <button id="ble">Connect Device</button>
                <div class="status-indicator inactive" id="live"></div>
                <button id="test">Test Connection</button>
            </div>
        </div>
        
        <div class="card" id="all_things_channels">
            <h3>Channel Setup</h3>
            <table>    
                <tr>
                    <td><button id="channel_connect">Connect</button></td>
                    <td><div class="status-indicator inactive" id="liveChan"></div></td>
                    <td style="color: var(--text-secondary);">Channel</td>
                    <td><input id="topic" maxlength="50" type="text" value="/splats"></td>
                    <td style="color: var(--text-secondary); text-align: center;">=</td>
                    <td><label id="channelValue">0</label></td>
                    <td><input id="payload" maxlength="50" type="text" value="send this"></td>
                    <td><button id="send">Send</button></td>
                </tr>
            </table>
            <div id="activity"></div>
        </div>
        
        <div class="card">
            <h3>Intelligence</h3>
            <div class="intelligence-flow">
                <div class="flow-row">
                    <span class="flow-label">If</span>
                    <select id="waitfor">
                        <option value="press">when pressed</option>
                        <option value="release">when released</option>
                        <option value="chan">when channel</option>
                    </select>
                </div>
                
                <div class="flow-row">
                    <span class="flow-label">Then</span>
                </div>
                
                <div id="action">
                    <div class="action-row">
                        <select id="do_light">
                            <option value="nix">no lights</option>
                            <option value="0" selected>Light up red</option>
                            <option value="1">Light up orange</option>
                            <option value="2">Light up yellow</option>
                            <option value="3">Light up green</option>
                            <option value="4">Light up blue</option>
                            <option value="5">Light up indigo</option>
                            <option value="6">Light up violet</option>
                            <option value="7">Light up white</option>
                        </select>
                    </div>
                    <div class="action-row">
                        <span class="connector">And</span>
                        <select id="do_sound">
                            <option value="nada">no sound</option>
                            <option value="0" selected>sound like a cat</option>
                            <option value="1">sound like a chicken</option>
                            <option value="2">sound like a cow</option>
                            <option value="3">sound like a dog</option>
                            <option value="4">sound like a pig</option>
                            <option value="5">sound like a duck</option>
                            <option value="6">sound like a elephant</option>
                            <option value="7">sound like a horse</option>
                            <option value="note">play a note</option>
                        </select>
                        <div id="note-container" style="display: none;">
                            <select id="do_note">
                                <option value="1" selected>C</option>
                                <option value="2">D</option>
                                <option value="3">E</option>
                                <option value="4">F</option>
                                <option value="5">G</option>
                                <option value="6">A</option>
                                <option value="7">B</option>
                            </select>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="designer-credit">Designed by Claude</div>
    </div>
    
    <script>
        // Show/hide MIDI note input based on sound selection
        const soundSelect = document.getElementById('do_sound');
        const NoteContainer = document.getElementById('note-container');
        const NoteInput = document.getElementById('do_note');
        
        soundSelect.addEventListener('change', function() {
            if (this.value === 'note') {
                NoteContainer.style.display = 'block';
                // Trigger animation by removing and re-adding
                NoteInput.style.animation = 'none';
                setTimeout(() => {
                    NoteInput.style.animation = 'fadeIn 0.3s ease-out';
                }, 10);
                // Focus on input for better UX
                setTimeout(() => NoteInput.focus(), 100);
            } else {
                NoteContainer.style.display = 'none';
            }
        });
    </script>
    
    <script type="mpy-editor" env='splats'>
        print(await myHub.readBattery())
    </script>
</body>
</html>
